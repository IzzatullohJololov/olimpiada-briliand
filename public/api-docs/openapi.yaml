          maxLength: 500
          description: 11.2 Doimiy manzil
        home_phone: &id039
          type: string
          nullable: true
          maxLength: 100
          description: 11.3 Uy telefoni
        mobile_phone: &id040
          type: string
          maxLength: 100
          example: '+256700000000'
          description: 11.4 Mobil telefon
        email: &id041
          type: string
          format: email
          description: 11.5 Email
        official_language: &id042
          type: string
          enum: *id004
          description: 12.1 Rasmiy til
        native_languages: &id043
