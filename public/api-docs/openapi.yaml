            deb nomlanadi
        face_photo: &id057
          type: string
          format: binary
          description: 8.7 Yuz surati, faqat *.jpg, ≤5 MB, kamida 900×1200 px. Faqat `needs_visa_invitation=true` bo'lsa majburiy. Saqlanganda
            `Face-Familiya.jpg`
    AdminUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        permissions:
          type: array
          items:
            type: string
          description: "Ruxsatlar: ['*'] — hammasi; aks holda teams.manage, payments, settings, users dan tanlanganlari"
        is_super:
          type: boolean
        created_at:
          type: string
          format: date-time
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      example:
        message: The family name en field format is invalid.
        errors:
          family_name_en:
          - Faqat ingliz alifbosining 26 ta harfidan foydalaning (The family name en must use Latin letters only).
    Message: &id007
      type: object
      properties:
        message:
          type: string
  responses:
    Unauthorized:
      description: Token yo'q yoki yaroqsiz
      content:
        application/json:
          schema: *id007
          example:
            message: Unauthenticated.
    Forbidden:
      description: Ruxsat yo'q
      content:
        application/json:
          schema: *id007
    NotFound:
      description: Topilmadi (yoki boshqa jamoaga tegishli)
      content:
        application/json:
          schema: *id007
    Unverified:
      description: Email tasdiqlanmagan
      content:
        application/json:
          schema: *id007
          example:
            message: Your email address is not verified.
    Validation:
      description: Validatsiya xatosi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Locked:
      description: Jamoa yakuniy yuborilgan yoki ro'yxatdan o'tish muddati tugagan
      content:
        application/json:
          schema: *id007
          example:
            message: Ro'yxat yakuniy yuborilgan, o'zgartirib bo'lmaydi. Kerak bo'lsa tashkilotchilarga murojaat qiling.
    TooMany:
      description: Juda ko'p so'rov (throttle)
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Jamoani ro'yxatdan o'tkazish
      description: User va jamoa yaratadi, emailga tasdiqlash havolasi yuboradi. 10 so'rov/daqiqa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - password
              - password_confirmation
              - country
              properties:
                name:
                  type: string
                  description: Mas'ul shaxs ismi
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
                country:
                  type: string
                  description: Davlat/jamoa nomi (noyob)
                  example: Uganda
            example:
              name: John Okello
              email: john@example.ug
              password: secret123
              password_confirmation: secret123
              country: Uganda
      responses:
        '201':
          description: Yaratildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                  message:
                    type: string
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/TooMany'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Kirish
      description: 10 so'rov/daqiqa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Muvaffaqiyatli
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/TooMany'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Chiqish (joriy tokenni bekor qiladi)
      security: &id008
      - bearerAuth: []
      responses:
        '200':
          description: Chiqildi
          content:
            application/json:
              schema: *id007
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Joriy foydalanuvchi va jamoa
      security: *id008
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Parolni tiklash havolasini yuborish
      description: 'Email ro''yxatda bormi-yo''qmi, javob bir xil. Havola: `{frontend}/reset-password?token=...&email=...`. 5 so''rov/daqiqa.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Yuborildi (agar email mavjud bo'lsa)
          content:
            application/json:
              schema: *id007
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/TooMany'
  /auth/reset-password:
    post:
      tags:
      - Auth
      summary: Yangi parol o'rnatish
      description: Barcha eski tokenlar bekor qilinadi. 5 so'rov/daqiqa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - email
              - password
              - password_confirmation
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        '200':
          description: Parol yangilandi
          content:
