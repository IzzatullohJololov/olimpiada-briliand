openapi: 3.0.3
info:
  title: IAO 2026 Registration API
  version: 1.0.0
  description: 'IAO 2026 (XXX Xalqaro astronomiya olimpiadasi, Andijon, 6–14 dekabr 2026) ro''yxatdan o''tish API''si.


    **Oqim:** `register` → emailni tasdiqlash → `participants` qo''shish → `team/submit` (yakuniy yuborish; jamoa qulflanadi).


    **Autentifikatsiya:** `Authorization: Bearer <token>` (Laravel Sanctum). Barcha so''rovlarda `Accept: application/json` yuboring.


    **Umumiy xatolar:** 401 — token yo''q; 403 — ruxsat yo''q; 404 — topilmadi (boshqa jamoa ma''lumoti ham 404); 409 — email tasdiqlanmagan;

    422 — validatsiya; 423 — jamoa yuborilgan yoki muddat tugagan; 429 — juda ko''p so''rov.


    **Sanalar:** `KK.OO.YYYY`. **Fayl yuklash:** `multipart/form-data`. Fayl bilan *yangilash* uchun `POST` yuboring va `_method=PATCH` maydonini
    qo''shing

    (PHP multipart PATCH/PUT ni o''qimaydi). Faylsiz yangilash uchun oddiy JSON `PATCH` ishlaydi.'
servers:
- url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: http://localhost:8000
tags:
- name: Auth
- name: Team
- name: Participants
- name: Admin
- name: Meta
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: '`register` yoki `login` qaytargan token'
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        is_admin:
          type: boolean
        team:
          $ref: '#/components/schemas/Team'
    Team:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        country:
          type: string
          example: Uganda
        submitted_at:
          type: string
          format: date-time
          nullable: true
    Participant:
      type: object
      properties:
        id:
          type: integer
          example: 1
        status:
          type: string
          enum: &id001
          - team_leader
          - team_leader_jury
          - observer
          - student
          description: Maqomi
        student_group:
          type: string
          enum: &id002
          - alpha
          - beta
          - gamma
          nullable: true
          description: Guruh. `status=student` bo'lsa majburiy
        previous_prizewinner:
          type: boolean
          default: false
          description: Oldingi IAO I–II diplom sovrindori
        needs_visa_invitation:
          type: boolean
          default: false
          description: Viza taklifnomasi kerakmi
        is_paid:
          type: boolean
          default: false
          readOnly: true
          description: To'lov qildi / qilmadi. Faqat administrator o'zgartiradi (`PATCH /admin/participants/{id}/payment`); jamoa yuborsa e'tiborga olinmaydi.
        paid_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: To'langan deb belgilangan vaqt (ISO 8601)
        payment_note:
          type: string
          nullable: true
          maxLength: 255
          readOnly: true
          description: Tashkilotchilar izohi (kvitansiya raqami va h.k.)
        payment_amount:
          type: number
          format: double
          nullable: true
          readOnly: true
          example: 150
          description: To'lov summasi
        payment_currency:
          type: string
          nullable: true
          maxLength: 3
          readOnly: true
          example: USD
          description: Valyuta (USD, EUR, UZS, RUB). Summa bor, valyuta yo'q bo'lsa — USD
        family_name_en:
          type: string
          description: 1.1 Familiya (inglizcha). Faqat 26 ta lotin harfi; faqat BOSH HARFLARDA yozish rad etiladi
          maxLength: 100
          example: Okello
        first_name_en:
          type: string
          description: 1.2 Ism (inglizcha). Faqat 26 ta lotin harfi; faqat BOSH HARFLARDA yozish rad etiladi
          maxLength: 100
          example: Peter James
        family_name_native:
          type: string
          maxLength: 100
          example: Окелло
          description: 2.1 Familiya (ona tilida, istalgan yozuv)
        first_name_native:
          type: string
          maxLength: 100
          example: Питер Джеймс
          description: 2.2 Ism (ona tilida)
        birth_date:
          type: string
          pattern: ^\d{2}\.\d{2}\.\d{4}$
          example: 12.05.2009
          description: 3 Tug'ilgan sana, KK.OO.YYYY (bugundan oldin)
        birth_place:
          type: string
          maxLength: 255
          example: Kampala, Uganda
          description: 4 Tug'ilgan joy
        sex:
          type: string
          enum: &id003
          - male
          - female
          description: 5 Jinsi
        citizenship:
          type: string
          example: Ugandan
          description: 6.1 Hozirgi fuqarolik
        other_citizenships:
          type: string
          nullable: true
          description: 6.2 Avvalgi/qo'shimcha fuqaroliklar
        ethnicity:
          type: string
          nullable: true
          description: 6.3 Millati
        previous_visits_uz:
          type: string
          nullable: true
          maxLength: 1000
          description: 6.4 O'zbekistonga avvalgi tashriflar
        passport_number:
          type: string
          nullable: true
          maxLength: 50
          example: B1234567
          description: 8.1 Pasport raqami (butun tizimda noyob). Faqat `needs_visa_invitation=true` bo'lsa majburiy.
        passport_issue_date:
          type: string
          pattern: ^\d{2}\.\d{2}\.\d{4}$
          example: 12.05.2009
          nullable: true
          description: 8.2 Berilgan sana (bugun yoki oldin). Faqat `needs_visa_invitation=true` bo'lsa majburiy.
        passport_expiry_date:
          type: string
          pattern: ^\d{2}\.\d{2}\.\d{4}$
          example: 12.05.2009
          nullable: true
          description: 8.3 Amal qilish muddati (kelajakda). Faqat `needs_visa_invitation=true` bo'lsa majburiy.
        passport_issued_by:
          type: string
          nullable: true
          maxLength: 255
          description: 8.4 Pasportni bergan organ. Faqat `needs_visa_invitation=true` bo'lsa majburiy.
        has_passport_scan:
          type: boolean
        has_face_photo:
          type: boolean
        position:
          type: string
          maxLength: 255
          example: Student
          description: 9 Lavozimi (talaba, o'qituvchi...)
        org_name:
          type: string
          maxLength: 255
          description: 10.1 Ish/o'qish tashkilotining nomi
        org_location:
          type: string
          maxLength: 255
          description: 10.2 Tashkilot joylashgan joy
        org_address:
          type: string
          nullable: true
          maxLength: 500
          description: 10.3 Tashkilot manzili (indeks bilan). Faqat `needs_visa_invitation=true` bo'lsa majburiy.
        org_contacts:
          type: string
          nullable: true
          maxLength: 500
          description: 10.4 Faks, telefon, email. Faqat `needs_visa_invitation=true` bo'lsa majburiy.
        graduation_date:
          type: string
          nullable: true
          maxLength: 50
          example: June 2027
          description: 10.5 Tamomlash oy/yili
        previous_olympiads:
          type: string
          nullable: true
          maxLength: 1000
          example: 'IAO-2025: Diploma of participating'
          description: 10.6 Avval qatnashgan IAO/APAO
        home_location:
          type: string
          maxLength: 255
          description: 11.1 Yashash joyi
        home_address:
          type: string
          maxLength: 500
          description: 11.2 Doimiy manzil
        home_phone:
          type: string
          nullable: true
          maxLength: 100
          description: 11.3 Uy telefoni
        mobile_phone:
          type: string
          maxLength: 100
          example: '+256700000000'
          description: 11.4 Mobil telefon
        email:
          type: string
          format: email
          description: 11.5 Email
        official_language:
          type: string
          enum: &id004
          - russian
          - english
          - both
          description: 12.1 Rasmiy til
        native_languages:
          type: string
          maxLength: 255
          example: Luganda
          description: '12.2 Ona tillari (rahbar uchun: tarjima qila oladigan tillar)'
        diet:
          type: string
          enum: &id005
          - standard
          - vegetarian
          - avoid_pork
          default: standard
          description: 13.1 Ovqatlanish
        food_notes:
          type: string
          nullable: true
          maxLength: 1000
          description: 13.2 Ovqat bo'yicha izoh
        medical_notes:
          type: string
          nullable: true
          maxLength: 1000
          description: 13.3 Tibbiy izoh
        tshirt_size:
          type: string
          nullable: true
          enum: &id006
          - XXS
          - XS
          - S
          - M
          - L
          - XL
          - XXL
          - XXXL
          - null
          description: 13.4 Futbolka o'lchami
        emergency_contact:
          type: object
          properties:
            family_name:
              type: string
            first_name:
              type: string
            relation:
              type: string
            age:
              type: integer
              nullable: true
            languages:
              type: string
              nullable: true
            phones:
              type: string
            email:
              type: string
              nullable: true
            telegram:
              type: string
              nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ParticipantInput:
      type: object
      required:
      - status
      - family_name_en
      - first_name_en
      - family_name_native
      - first_name_native
      - birth_date
      - birth_place
      - sex
      - citizenship
      - position
      - org_name
      - org_location
      - home_location
      - home_address
      - mobile_phone
      - email
      - official_language
      - native_languages
      - emergency_family_name
      - emergency_first_name
      - emergency_relation
      - emergency_phones
      properties: &id010
        status: &id011
          type: string
          enum: *id001
          description: Maqomi
        student_group: &id012
          type: string
          enum: *id002
          nullable: true
          description: Guruh. `status=student` bo'lsa majburiy
        previous_prizewinner: &id013
          type: boolean
          default: false
          description: Oldingi IAO I–II diplom sovrindori
        needs_visa_invitation: &id014
          type: boolean
          default: false
          description: Viza taklifnomasi kerakmi
        family_name_en: &id015
          type: string
          description: 1.1 Familiya (inglizcha). Faqat 26 ta lotin harfi; faqat BOSH HARFLARDA yozish rad etiladi
          maxLength: 100
          example: Okello
        first_name_en: &id016
          type: string
          description: 1.2 Ism (inglizcha). Faqat 26 ta lotin harfi; faqat BOSH HARFLARDA yozish rad etiladi
          maxLength: 100
          example: Peter James
        family_name_native: &id017
