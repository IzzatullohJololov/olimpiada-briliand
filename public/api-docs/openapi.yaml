        org_contacts: &id034
          type: string
          nullable: true
          maxLength: 500
          description: 10.4 Faks, telefon, email. Faqat `needs_visa_invitation=true` bo'lsa majburiy.
        graduation_date: &id035
          type: string
          nullable: true
          maxLength: 50
          example: June 2027
          description: 10.5 Tamomlash oy/yili
        previous_olympiads: &id036
          type: string
          nullable: true
          maxLength: 1000
          example: 'IAO-2025: Diploma of participating'
          description: 10.6 Avval qatnashgan IAO/APAO
        home_location: &id037
