          maxLength: 100
          example: Питер Джеймс
          description: 2.2 Ism (ona tilida)
        birth_date: &id019
          type: string
          pattern: ^\d{2}\.\d{2}\.\d{4}$
          example: 12.05.2009
          description: 3 Tug'ilgan sana, KK.OO.YYYY (bugundan oldin)
        birth_place: &id020
          type: string
          maxLength: 255
          example: Kampala, Uganda
          description: 4 Tug'ilgan joy
        sex: &id021
          type: string
          enum: *id003
          description: 5 Jinsi
        citizenship: &id022
          type: string
          example: Ugandan
          description: 6.1 Hozirgi fuqarolik
        other_citizenships: &id023
          type: string
          nullable: true
          description: 6.2 Avvalgi/qo'shimcha fuqaroliklar
        ethnicity: &id024
          type: string
          nullable: true
          description: 6.3 Millati
        previous_visits_uz: &id025
